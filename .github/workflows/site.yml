name: Race site

# Fetches fresh race data and deploys site/ to GitHub Pages, in one run.
# No data branch and no write token: the data only lives in the Pages artifact.
# If Raider.IO fails, the fetcher exits 1, nothing deploys, and the live site keeps
# its last good data (its "Bijgewerkt" line turns gold once it's over 150 min old).
# Only schedule, manual and main-push triggers: never pull_request here.
on:
  schedule:
    # Raid evenings (17-23 UTC = 19-01 h in summer, 18-00 h in winter): every 30 min.
    # The rest of the day nothing changes, so every 2 h. Off the hour, since GitHub
    # delays :00 runs the most. ~23 runs a day, ~80 Raider.IO requests each.
    - cron: "7,37 17-23 * * *"
    - cron: "7 0-16/2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv sync --locked --no-dev

      - name: Fetch race data
        env:
          # Optional: without them (or when WCL fails) the site runs on Raider.IO alone.
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: uv run --no-sync python -m racetodutchfirst

      - name: Standings in the HTML
        # The board and tier pills written into index.html for crawlers (app.js replaces
        # them). If this fails, the plain index.html deploys: the page works the same.
        continue-on-error: true
        run: uv run --no-sync python -m racetodutchfirst.prerender

      - name: Share image
        # og.png for link previews: og.html drawn from the fresh race.json by headless
        # Chrome (part of the runner image). If this fails, the og.png committed in the
        # repo deploys instead: an older picture beats skipping the deploy.
        continue-on-error: true
        env:
          CHROME_FLAGS: --no-sandbox
        run: scripts/og-image.sh

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
