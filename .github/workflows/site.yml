name: Race site

# Fetches fresh race data and deploys site/ to GitHub Pages, in one run.
# No data branch and no write token: the data only lives in the Pages artifact.
# If Raider.IO fails, the fetcher exits 1, nothing deploys, and the live site keeps
# its last good data (its "Bijgewerkt" line turns gold once it's over 90 min old).
# Only schedule, manual and main-push triggers: never pull_request here.
on:
  schedule:
    # Every 30 minutes, off the hour (GitHub delays :00 runs the most).
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv sync --locked --no-dev

      - name: Fetch race data
        env:
          # Optional; the site works on Raider.IO alone. Warcraft Logs isn't built in yet.
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: uv run --no-sync python -m racetodutchfirst

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
